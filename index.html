<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dff4ff">
<title>Perícia Contábil — Professor Moreira</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#dff4ff;font-family:Arial,Helvetica,sans-serif}
  body{min-height:100dvh;display:flex;align-items:center;justify-content:center;overscroll-behavior:none}
  .app{width:min(100%,520px);min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:10px 10px max(12px,env(safe-area-inset-bottom))}
  .stage{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;flex:1;touch-action:pan-y}
  #slide{display:block;max-width:100%;max-height:calc(100dvh - 105px);width:auto;height:auto;object-fit:contain;border-radius:14px;box-shadow:0 5px 18px rgba(0,0,0,.18);user-select:none;-webkit-user-drag:none}
  .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;border-radius:50%;background:rgba(0,67,117,.82);color:#fff;font-size:30px;line-height:44px;display:grid;place-items:center;cursor:pointer}
  .prev{left:5px}.next{right:5px}
  .bar{display:flex;align-items:center;justify-content:center;gap:12px;padding-top:10px}
  .count{min-width:72px;text-align:center;font-size:18px;font-weight:700;color:#073e68}
  .reset{border:0;border-radius:12px;background:#b51f2e;color:#fff;padding:10px 16px;font-size:16px;font-weight:700;cursor:pointer}
  button:active{transform:scale(.97)}
  @media(max-width:380px){.nav{width:40px;height:40px;font-size:26px}.app{padding-left:6px;padding-right:6px}}
</style>
</head>
<body>
<main class="app" aria-label="Carrossel Perícia Contábil">
  <section class="stage" id="stage">
    <img id="slide" src="imagens/01.webp" alt="Slide 1 de 6" draggable="false" decoding="async" fetchpriority="high">
    <button class="nav prev" id="prev" aria-label="Imagem anterior">‹</button>
    <button class="nav next" id="next" aria-label="Próxima imagem">›</button>
  </section>
  <div class="bar">
    <div class="count" id="count">1 / 6</div>
    <button class="reset" id="reset">↻ Reiniciar</button>
  </div>
</main>

<script>
(() => {
  const total = 6;
  let current = 1;
  const slide = document.getElementById('slide');
  const count = document.getElementById('count');
  const stage = document.getElementById('stage');
  const path = n => `imagens/${String(n).padStart(2,'0')}.webp`;

  function preload(n){
    if(n < 1 || n > total) return;
    const img = new Image();
    img.src = path(n);
  }

  function show(n){
    if(n < 1) n = total;
    if(n > total) n = 1;
    current = n;
    slide.src = path(current);
    slide.alt = `Slide ${current} de ${total}`;
    count.textContent = `${current} / ${total}`;
    preload(current + 1);
    preload(current - 1);
  }

  document.getElementById('prev').addEventListener('click', () => show(current - 1));
  document.getElementById('next').addEventListener('click', () => show(current + 1));
  document.getElementById('reset').addEventListener('click', () => show(1));

  document.addEventListener('keydown', e => {
    if(e.key === 'ArrowLeft') show(current - 1);
    if(e.key === 'ArrowRight') show(current + 1);
    if(e.key === 'Home') show(1);
  });

  let startX = 0, startY = 0;
  stage.addEventListener('touchstart', e => {
    const t = e.changedTouches[0];
    startX = t.clientX; startY = t.clientY;
  }, {passive:true});

  stage.addEventListener('touchend', e => {
    const t = e.changedTouches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    if(Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.2){
      dx < 0 ? show(current + 1) : show(current - 1);
    }
  }, {passive:true});

  preload(2);
})();
</script>
</body>
</html>
